<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>VMN × IDEA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: navy masthead band, then a single centered column that swaps between
   the role picker and the role's question form. Orange is the only accent. */
:root{
  --navy:#114058; --navy-deep:#0b2c3d;
  --orange:#f2762e; --orange-ink:#b84f12;
  --bg:#f5f7f8; --surface:#ffffff; --fg:#13232c; --muted:#5b6e78; --line:#d6e0e5;
  --on-navy:#ffffff; --on-navy-muted:#a9c3cf;
  --focus:rgba(242,118,46,.35);
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c171d; --surface:#132630; --fg:#e8f0f3; --muted:#93a9b4; --line:#24404e;
    --navy:#0f3a50; --navy-deep:#082230; --orange:#ff8a45; --orange-ink:#ffa46d;
    --focus:rgba(255,138,69,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c171d; --surface:#132630; --fg:#e8f0f3; --muted:#93a9b4; --line:#24404e;
  --navy:#0f3a50; --navy-deep:#082230; --orange:#ff8a45; --orange-ink:#ffa46d;
  --focus:rgba(255,138,69,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy-deep)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Masthead */
.mast{background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.mast::after{content:"";position:absolute;inset:auto -10% -1px -10%;height:6px;background:var(--orange)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px;font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:.04em}
.mark{display:flex;align-items:center;gap:10px;color:var(--on-navy);text-decoration:none}
.mark b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.mark .x{color:var(--orange)}
.nav .tag{color:var(--on-navy-muted);text-transform:uppercase;font-size:12px;letter-spacing:.12em}
.hero{padding-block:36px 52px;display:grid;gap:14px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,60px);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance;max-width:16ch}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero p{margin:0;max-width:56ch;color:var(--on-navy-muted);font-size:17px}

main{padding-block:40px 72px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}

/* Role picker */
.roles{max-width:820px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.role{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;padding:22px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;transition:border-color .15s,transform .15s,box-shadow .15s;min-width:0}
.role:hover{border-color:var(--orange);transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(17,64,88,.45)}
.role:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-color:var(--orange)}
.role .glyph{width:44px;height:44px;border-radius:10px;background:var(--navy);color:var(--on-navy);display:grid;place-items:center}
.role h3{margin:0;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.01em}
.role p{margin:0;color:var(--muted);font-size:15px}
.role .go{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--orange-ink);letter-spacing:.04em}

/* Form */
.formwrap{max-width:620px;margin:0 auto}
.back{all:unset;cursor:pointer;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center;margin-bottom:18px}
.back:hover{color:var(--fg)} .back:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:28px;display:grid;gap:22px}
.card h2{margin:0;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.01em;color:var(--fg)}
.card .sub{margin:-14px 0 0;color:var(--muted)}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:var(--navy);color:var(--on-navy);padding:4px 9px;border-radius:999px;margin-bottom:10px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>.lbl{font-weight:600;font-size:15px}
.req{color:var(--orange-ink)}
.help{font-size:13px;color:var(--muted);margin-top:-2px}
input[type=text],input[type=email],input[type=url],select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 4px var(--focus)}
.invalid input,.invalid select,.invalid textarea,.invalid .rank{border-color:#d0422b}
.err{font-size:13px;color:#d0422b;display:none}
.invalid .err{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{position:relative;cursor:pointer}
.opts input{position:absolute;opacity:0;inset:0}
.opts span{display:inline-block;padding:7px 13px;border:1.5px solid var(--line);border-radius:999px;font-size:14px;background:var(--bg);transition:all .12s}
.opts input:checked+span{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.opts input:focus-visible+span{box-shadow:0 0 0 4px var(--focus)}

/* Drag-to-rank */
.rank{list-style:none;margin:0;padding:0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.rank li{display:flex;align-items:center;gap:12px;padding:9px 10px 9px 12px;border-top:1px solid var(--line);background:var(--surface);user-select:none;touch-action:none}
.rank li:first-child{border-top:0}
.rank li.dragging{opacity:.55;background:var(--bg)}
.rank .n{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--orange-ink);width:22px;text-align:right;font-variant-numeric:tabular-nums}
.rank .t{flex:1;min-width:0}
.rank .handle{cursor:grab;color:var(--muted);padding:4px;font-family:var(--mono);letter-spacing:-2px}
.rank .mv{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.rank .mv:hover{background:var(--bg);color:var(--fg)}
.rank .mv:focus-visible{outline:2px solid var(--orange)}
.rank .mv:disabled{opacity:.25;cursor:default}

.submit{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;background:var(--orange);color:#1b0d04;font-weight:600;font-size:16px;padding:13px 20px;border-radius:10px;transition:filter .15s}
.submit:hover{filter:brightness(1.06)} .submit:disabled{opacity:.6;cursor:wait} .submit:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

.done{text-align:center;justify-items:center}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--orange);color:#1b0d04;display:grid;place-items:center}
.summary{width:100%;text-align:left;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:10px;font-size:14px}
.summary div{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:12px}
.summary dt{color:var(--muted)} .summary dd{margin:0;overflow-wrap:anywhere}

.match{width:100%;text-align:left;background:var(--navy);color:var(--on-navy);border-radius:14px;padding:22px;display:grid;gap:6px}
.match .chip{background:var(--orange);color:#1b0d04;justify-self:start;margin:0 0 4px}
.mname{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.05;letter-spacing:-.02em;overflow-wrap:anywhere}
.mmeta{color:var(--on-navy-muted);font-size:15px}
.why{margin:10px 0 0;padding:12px 0 0 18px;border-top:1px solid rgba(255,255,255,.15);display:grid;gap:4px;font-size:14px;color:var(--on-navy)}
.why b{color:var(--orange)}
.note{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;text-align:left}
.welcome{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--surface);border:1.5px solid var(--orange);border-radius:12px;padding:12px 16px;margin-bottom:22px;font-size:15px;max-width:820px}
.linkbtn{all:unset;cursor:pointer;font-family:var(--mono);font-weight:600;font-size:13px;color:var(--orange-ink)}
.linkbtn:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:4px}
footer{border-top:1px solid var(--line);padding-block:20px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}

@media (max-width:760px){.roles{grid-template-columns:1fr}.role{grid-template-rows:auto;grid-template-columns:44px 1fr;column-gap:14px}.role .glyph{grid-row:span 3}.role .go{grid-column:2}}
@media (max-width:520px){.row2{grid-template-columns:1fr}.card{padding:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="mast">
  <div class="wrap">
    <nav class="nav">
      <a class="mark" href="#" id="home-link"><b>VMN <span class="x">×</span> IDEA</b></a>
      <span class="tag">Matchmaking</span>
    </nav>
    <div class="hero">
      <h1>Find your match at <em>VMN × IDEA</em></h1>
      <p>Tell us who you are and what you're looking for. Founders get matched on the spot with the mentor or investor whose strengths fit their biggest challenges.</p>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="view-roles">
    <div class="welcome" id="welcome" hidden></div>
    <p class="eyebrow">Step 1 · I'm joining as a…</p>
    <div class="roles" id="roles"></div>
  </section>

  <section id="view-form" hidden>
    <div class="formwrap">
      <button class="back" id="back" type="button">← Change role</button>
      <form class="card" id="form" novalidate></form>
    </div>
  </section>

  <section id="view-done" hidden>
    <div class="formwrap">
      <div class="card done" id="done"></div>
    </div>
  </section>
</main>

<footer><div class="wrap">VMN × IDEA · Northeastern University</div></footer>

<script>
/* ============================================================
   SETTINGS
   SUBMIT_URL: paste your Google Apps Script web-app URL here
   (see setup steps). Leave "" to run without saving.
   ============================================================ */
const SUBMIT_URL = "https://script.google.com/macros/s/AKfycbx-BiRtXVdM88Z5G9IraGeD_AsG2DMoyRMWgszqhQAUtQd0CxCElpM4XkQS_ZS-XXdU/exec";

/* Founders rank what they NEED, mentors rank their STRENGTHS.
   Both use this same list so they can be matched. */
const SKILLS = [
  "Business strategy",
  "Marketing & branding",
  "Sales & go-to-market",
  "Fundraising & pitching",
  "Financial modeling",
  "Product & UX design",
  "Software development",
  "Data analysis & AI/ML",
  "Operations & supply chain",
  "Legal & IP"
];

const INDUSTRIES = [
  "AI & software",
  "Fintech",
  "Healthcare & biotech",
  "Consumer products",
  "Food & beverage",
  "E-commerce & retail",
  "Edtech",
  "Climate & energy",
  "Hardware & robotics",
  "Media & entertainment",
  "Real estate & proptech",
  "Social impact & nonprofit",
  "Other"
];

/* ============================================================
   EDIT YOUR QUESTIONS HERE
   Question types: text, email, url, textarea, select, choice
   (pick one), multi (pick many), rank (drag to order).
   Add `required: true` to make a question mandatory.
   Matching uses these ids, so keep them as they are:
   founder: name, email, venture, industry, needs
   mentor:  name, email, company, industries, skills, teams
   ============================================================ */
const ROLES = {
  founder: {
    title: "Founder",
    blurb: "You're building a venture and want guidance, feedback, or funding.",
    icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>',
    questions: [
      { id:"name", label:"Full name", type:"text", required:true },
      { id:"email", label:"Email", type:"email", required:true },
      { id:"venture", label:"Venture name", type:"text", required:true },
      { id:"stage", label:"Stage", type:"choice", options:["Idea","Prototype","Launched","Revenue"], required:true },
      { id:"industry", label:"Industry", type:"select", options:INDUSTRIES, required:true },
      { id:"needs", label:"Rank the help you need most", type:"rank", help:"Drag or use the arrows. Top = what you need most. We use this to match you with a mentor.",
        options:SKILLS },
      { id:"pitch", label:"Describe your venture in two sentences", type:"textarea" }
    ]
  },
  mentor: {
    title: "Mentor",
    blurb: "Operators, VCs, and angel investors who want to coach a founding team.",
    icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>',
    questions: [
      { id:"name", label:"Full name", type:"text", required:true },
      { id:"email", label:"Email", type:"email", required:true },
      { id:"type", label:"I'm joining as", type:"choice", options:["Mentor / operator","VC investor","Angel investor"], required:true },
      { id:"company", label:"Company or firm & role", type:"text" },
      { id:"linkedin", label:"LinkedIn URL", type:"url" },
      { id:"industries", label:"Industries you know well", type:"multi", options:INDUSTRIES, required:true },
      { id:"skills", label:"Rank your strengths", type:"rank", help:"Drag or use the arrows. Top = your strongest area. We use this to match you with founders.",
        options:SKILLS },
      { id:"teams", label:"How many teams can you mentor?", type:"choice", options:["1","2","3"], required:true }
    ]
  }
};
</script>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const views = { roles:$('#view-roles'), form:$('#view-form'), done:$('#view-done') };
  let current = null;
  const goHome = () => { if (location.hash) location.hash = ''; else route(); };

  // Role cards
  $('#roles').innerHTML = Object.entries(ROLES).map(([key,r]) =>
    `<button class="role" type="button" data-role="${key}">
       <span class="glyph">${r.icon}</span>
       <h3>${esc(r.title)}</h3>
       <p>${esc(r.blurb)}</p>
       <span class="go">Continue as ${esc(r.title.toLowerCase())} →</span>
     </button>`).join('');
  $('#roles').addEventListener('click', e => {
    const b = e.target.closest('[data-role]'); if (b) location.hash = b.dataset.role;
  });
  $('#back').addEventListener('click', () => { goHome(); });
  $('#home-link').addEventListener('click', e => { e.preventDefault(); goHome(); });

  function show(name){
    Object.entries(views).forEach(([k,v]) => v.hidden = k !== name);
    window.scrollTo({ top: name === 'roles' ? 0 : document.querySelector('main').offsetTop - 8, behavior: 'smooth' });
  }

  function fieldHTML(q, i){
    const id = `q-${current}-${q.id}`;
    const star = q.required ? ' <span class="req" aria-hidden="true">*</span>' : '';
    const help = q.help ? `<div class="help">${esc(q.help)}</div>` : '';
    const err = `<div class="err" role="alert">${q.type==='multi'?'Pick at least one option.':q.type==='email'?'Enter a valid email address.':'This one is required.'}</div>`;
    const req = q.required ? 'required' : '';
    switch(q.type){
      case 'textarea':
        return `<div class="field" data-q="${q.id}"><label for="${id}">${esc(q.label)}${star}</label>${help}<textarea id="${id}" name="${q.id}" ${req}></textarea>${err}</div>`;
      case 'select':
        return `<div class="field" data-q="${q.id}"><label for="${id}">${esc(q.label)}${star}</label>${help}<select id="${id}" name="${q.id}" ${req}><option value="">Select…</option>${q.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select>${err}</div>`;
      case 'choice': case 'multi': {
        const t = q.type==='choice' ? 'radio' : 'checkbox';
        return `<fieldset class="field" data-q="${q.id}" style="border:0;padding:0;margin:0"><legend class="lbl" style="padding:0;margin-bottom:6px">${esc(q.label)}${star}</legend>${help}<div class="opts">${q.options.map((o,j)=>`<label><input type="${t}" id="${id}-${j}" name="${q.id}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>${err}</fieldset>`;
      }
      case 'rank':
        return `<div class="field" data-q="${q.id}"><div class="lbl" id="${id}-l">${esc(q.label)}${star}</div>${help}<ol class="rank" id="${id}" aria-labelledby="${id}-l">${q.options.map(o=>`<li data-v="${esc(o)}"><span class="n"></span><span class="t">${esc(o)}</span><button type="button" class="mv" data-d="-1" aria-label="Move ${esc(o)} up">↑</button><button type="button" class="mv" data-d="1" aria-label="Move ${esc(o)} down">↓</button><span class="handle" aria-hidden="true">⋮⋮</span></li>`).join('')}</ol></div>`;
      default:
        return `<div class="field" data-q="${q.id}"><label for="${id}">${esc(q.label)}${star}</label>${help}<input type="${q.type}" id="${id}" name="${q.id}" ${req} autocomplete="${q.type==='email'?'email':q.id==='name'?'name':'off'}">${err}</div>`;
    }
  }

  function renderForm(key){
    current = key;
    const r = ROLES[key];
    const qs = r.questions;
    // pair short fields (name + email) side by side
    let html = `<div><span class="chip">${esc(r.title)}</span><h2>Tell us about yourself</h2></div><p class="sub">Fields marked <span class="req">*</span> are required.</p>`;
    for (let i=0;i<qs.length;i++){
      const a=qs[i], b=qs[i+1];
      const short = q => q && ['text','email','url'].includes(q.type);
      if (short(a) && short(b) && i%2===0){ html += `<div class="row2">${fieldHTML(a)}${fieldHTML(b)}</div>`; i++; }
      else html += fieldHTML(a);
    }
    html += `<button class="submit" type="submit">Submit as ${esc(r.title.toLowerCase())}</button>`;
    const form = $('#form');
    form.innerHTML = html;
    form.querySelectorAll('.rank').forEach(initRank);
  }

  // Ranking: pointer drag + arrow buttons
  function renumber(ol){
    const items=[...ol.children];
    items.forEach((li,i)=>{ li.querySelector('.n').textContent=(i+1)+'.'; li.querySelector('[data-d="-1"]').disabled=i===0; li.querySelector('[data-d="1"]').disabled=i===items.length-1; });
  }
  function initRank(ol){
    renumber(ol);
    ol.addEventListener('click', e=>{
      const b=e.target.closest('.mv'); if(!b||b.disabled) return;
      const li=b.closest('li'); const d=+b.dataset.d;
      if(d<0) ol.insertBefore(li, li.previousElementSibling); else ol.insertBefore(li.nextElementSibling, li);
      renumber(ol); b.focus();
    });
    let drag=null;
    ol.addEventListener('pointerdown', e=>{
      if(e.target.closest('.mv')) return;
      const li=e.target.closest('li'); if(!li) return;
      drag=li; li.classList.add('dragging'); ol.setPointerCapture(e.pointerId); e.preventDefault();
    });
    ol.addEventListener('pointermove', e=>{
      if(!drag) return;
      const over=[...ol.children].find(li=>{ if(li===drag) return false; const r=li.getBoundingClientRect(); return e.clientY>r.top && e.clientY<r.bottom; });
      if(!over) return;
      const r=over.getBoundingClientRect();
      ol.insertBefore(drag, e.clientY < r.top + r.height/2 ? over : over.nextElementSibling);
      renumber(ol);
    });
    const end=()=>{ if(drag){ drag.classList.remove('dragging'); drag=null; } };
    ol.addEventListener('pointerup', end); ol.addEventListener('pointercancel', end);
  }

  function collect(){
    const form=$('#form'); const out=[]; let firstBad=null;
    ROLES[current].questions.forEach(q=>{
      const wrap=form.querySelector(`[data-q="${q.id}"]`); let val;
      if(q.type==='rank') val=[...wrap.querySelectorAll('li')].map(li=>li.dataset.v);
      else if(q.type==='multi') val=[...wrap.querySelectorAll('input:checked')].map(i=>i.value);
      else if(q.type==='choice') val=(wrap.querySelector('input:checked')||{}).value||'';
      else val=wrap.querySelector('input,select,textarea').value.trim();
      let ok=true;
      if(q.required && (Array.isArray(val)?!val.length:!val)) ok=false;
      if(q.type==='email' && val && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) ok=false;
      wrap.classList.toggle('invalid', !ok);
      if(!ok && !firstBad) firstBad=wrap;
      out.push({q, val});
    });
    return {out, firstBad};
  }

  const newSid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2);
  const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };

  // Looks up a submission by its random id. Uses JSONP so it works even
  // when the browser can't read Google's reply to the POST.
  function lookup(sid){
    return new Promise((resolve,reject)=>{
      const cb='vmncb_'+Math.random().toString(36).slice(2);
      const s=document.createElement('script');
      const t=setTimeout(()=>{ cleanup(); reject(new Error('timeout')); }, 20000);
      function cleanup(){ clearTimeout(t); delete window[cb]; s.remove(); }
      window[cb]=data=>{ cleanup(); resolve(data); };
      s.onerror=()=>{ cleanup(); reject(new Error('network')); };
      s.src=SUBMIT_URL+(SUBMIT_URL.includes('?')?'&':'?')+'sid='+encodeURIComponent(sid)+'&callback='+cb;
      document.body.appendChild(s);
    });
  }

  async function send(role, out, sid){
    if(!SUBMIT_URL) return previewResult(role, out);   // preview mode: nothing is saved
    const answers={};
    out.forEach(({q,val})=>{ answers[q.id] = Array.isArray(val) ? (q.type==='rank' ? val.join(' > ') : val.join(', ')) : val; });
    const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(), 30000);
    try{
      // text/plain avoids a CORS preflight, which Apps Script can't answer
      const res=await fetch(SUBMIT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({role, sid, answers}),signal:ctrl.signal});
      const data=await res.json();
      if(data && data.ok) return data;
    }catch(e){ /* reply unreadable or slow: fall back to looking it up */ }
    finally{ clearTimeout(timer); }
    for(let i=0;i<3;i++){
      try{ const d=await lookup(sid); if(d && d.ok) return d; }catch(e){}
      await new Promise(r=>setTimeout(r,1500));
    }
    throw new Error('not saved');
  }

  // Sample result so the page can be tried before the Sheet is connected.
  function previewResult(role, out){
    const name=(out.find(o=>o.q.id==='name')||{}).val||'';
    if(role!=='founder') return {ok:true, role, name};
    const needs=(out.find(o=>o.q.id==='needs')||{}).val||SKILLS;
    return {ok:true, role, name, preview:true, match:{name:'Alex Rivera', type:'VC investor', company:'Example Ventures, Partner',
      covers:[{skill:needs[0],needRank:1,mentorRank:1},{skill:needs[1],needRank:2,mentorRank:3}], industryMatch:true, score:88}};
  }

  const ordinal = n => '#'+n;
  function renderDone(data){
    const first=esc(String(data.name||'').split(' ')[0]);
    const tick=`<span class="tick"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>`;
    let html='';
    if(data.role==='mentor'){
      html=`${tick}<h2>Thanks${first?', '+first:''}!</h2>
        <p class="sub" style="margin:0">You're signed up as a mentor. Founders are being matched with you right now based on your strengths, and they'll come find you in the room.</p>
        <div class="note"><b>While you wait:</b> make sure your name tag is visible so your founders can spot you.</div>`;
    } else if(data.match){
      const m=data.match;
      const why=(m.covers||[]).map(c=>`<li>Your <b>${ordinal(c.needRank)}</b> challenge, <b>${esc(c.skill)}</b>, is their <b>${ordinal(c.mentorRank)}</b> strength</li>`).join('')
        + (m.industryMatch?`<li>They know your industry</li>`:'');
      html=`<p class="eyebrow" style="margin:0">${data.preview?'Preview · sample match':'You\'re matched'}${first?' · '+first:''}</p>
        <div class="match">
          <span class="chip">Your mentor</span>
          <div class="mname">${esc(m.name)}</div>
          <div class="mmeta">${[m.type,m.company].filter(Boolean).map(esc).join(' · ')}</div>
          ${why?`<ul class="why">${why}</ul>`:''}
        </div>
        <p class="sub" style="margin:0">Go find <b>${esc(String(m.name).split(' ')[0])}</b> in the room and introduce yourself. Ask an organizer if you can't spot them.</p>
        <button class="back" type="button" data-again style="margin:0">← Back to start</button>`;
    } else {
      html=`${tick}<h2>You're in the queue${first?', '+first:''}.</h2>
        <p class="sub" style="margin:0">Every mentor is fully booked at the moment. More mentors are arriving, and you'll be paired as soon as a spot opens.</p>
        <button class="submit" type="button" data-check>Check for my mentor</button>
        <p class="err" data-check-msg style="margin:0"></p>`;
    }
    if(data.role==='mentor') html+=`<button class="back" type="button" data-again style="margin:0">← Back to start</button>`;
    $('#done').innerHTML=html;
    const again=$('#done [data-again]'); if(again) again.addEventListener('click', ()=>{ goHome(); });
    const chk=$('#done [data-check]');
    if(chk) chk.addEventListener('click', async ()=>{
      chk.disabled=true; chk.textContent='Checking…';
      const msg=$('#done [data-check-msg]'); msg.style.display='none';
      try{ const d=await lookup(lastSid()); if(d && d.ok){ renderDone(d); if(!d.match){ const m2=$('#done [data-check-msg]'); m2.textContent='Still waiting for a spot. Try again in a minute.'; m2.style.display='block'; } return; } }catch(e){}
      chk.disabled=false; chk.textContent='Check for my mentor';
      msg.textContent="Couldn't reach the matchmaker. Check your connection and try again."; msg.style.display='block';
    });
    show('done');
  }
  const lastSid = () => (store.get('vmn-last')||{}).sid;

  $('#form').addEventListener('submit', async e=>{
    e.preventDefault();
    const {out, firstBad}=collect();
    if(firstBad){ firstBad.scrollIntoView({behavior:'smooth',block:'center'}); const f=firstBad.querySelector('input,select,textarea'); f&&f.focus({preventScroll:true}); return; }
    const btn=$('#form .submit'); const label=btn.textContent;
    btn.disabled=true; btn.textContent=current==='founder'?'Finding your mentor…':'Submitting…';
    const sid=newSid();
    let data;
    try { data=await send(current, out, sid); }
    catch(err){
      btn.disabled=false; btn.textContent=label;
      let m=$('#form .send-err'); if(!m){ m=document.createElement('p'); m.className='send-err err'; m.style.display='block'; m.style.margin='0'; btn.after(m); }
      m.textContent="Couldn't submit. Check your connection and try again.";
      return;
    }
    if(SUBMIT_URL) store.set('vmn-last', {sid, role: current, name: data.name || ''});
    // Drop #founder/#mentor from the address so a refresh shows "Welcome back", not a blank form
    try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
    current=null;
    renderDone(data);
  });

  // Returning visitor (e.g. re-scanned the QR code): offer their result again
  function welcomeBack(){
    const last=store.get('vmn-last'); const box=$('#welcome');
    if(!last || !last.sid || !SUBMIT_URL){ box.hidden=true; return; }
    box.hidden=false;
    box.innerHTML=`<span>Welcome back${last.name?', '+esc(String(last.name).split(' ')[0]):''}. You've already signed up as a ${last.role==='founder'?'founder':'mentor'}.</span>${last.role==='founder'?'<button type="button" class="linkbtn" id="see-mine">See my mentor →</button>':''}`;
    const b=$('#see-mine');
    if(b) b.addEventListener('click', async ()=>{
      b.disabled=true; b.textContent='Loading…';
      try{ const d=await lookup(last.sid); if(d && d.ok){ renderDone(d); return; } }catch(e){}
      b.disabled=false; b.textContent="Couldn't load. Try again →";
    });
  }

  // When live input changes, clear that field's error
  $('#form').addEventListener('input', e=>{ const w=e.target.closest('.invalid'); if(w) w.classList.remove('invalid'); });

  function route(){
    const key=location.hash.slice(1);
    if(ROLES[key]){ if(current!==key || views.form.hidden) renderForm(key); show('form'); }
    else { current=null; show('roles'); welcomeBack(); }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
